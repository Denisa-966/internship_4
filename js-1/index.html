<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="from-section">
        <div class="container">
             <div class="from-wrapper">
                <form  method="post" class="form">
                    <div class="form-content">
                      <label for="name">Name : </label>
                      <input type="text" name="name" id="name" placeholder="Enter your name" required>
                      </div>
                      <div class="form-content">
                          <label for="city">City : </label>
                          <input type="text" name="city" id="city" placeholder="Enter your city" required>
                      </div>
                      <div class="form-content">
                          <label for="age">Age : </label>
                          <input type="number" name="age" id="age" placeholder="Enter your age" required>
                      </div>
                      <button type="submit" name="submit" value="Submit" class="btn">save</button>
                   </form>
            </div>
         
        </div>
    </div>
<script src="js-1/script.js"></script>
</body>
</html>
